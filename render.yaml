databases:
  - name: bouncepass-db
    plan: free
    databaseName: bouncepass
    user: bouncepass

services:
  - type: web
    name: bouncepass-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bouncepass-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: demo@bouncepass.net
      - key: ALLOWED_ORIGINS
        value: https://bouncepass.net,https://www.bouncepass.net
      - key: PYTHON_VERSION
        value: "3.11"
